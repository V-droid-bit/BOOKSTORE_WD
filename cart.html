<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cart-body">

    <h2>Your Shopping Cart</h2>
    
    <table class="cart-table">
        <tr>
            <th>Book name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>Java 2</td>
            <td>$35.5</td>
            <td>2</td>
            <td>$71.0</td>
        </tr>
        <tr>
            <td>XML bible</td>
            <td>$40.5</td>
            <td>1</td>
            <td>$40.5</td>
        </tr>
        <tr class="total-row">
            <td colspan="3" style="text-align: right; padding-right: 20px;">Total amount:</td>
            <td>$111.5</td>
        </tr>
    </table>

</body>
</html>
