<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cart-body">

    <h2>Your Shopping Cart</h2>
    <p id="cart-empty" hidden>Your cart is empty.</p>
    <table class="cart-table" id="cart-table" hidden>
        <thead>
            <tr>
                <th>Book name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cart-items"></tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="3" style="text-align: right; padding-right: 20px;">Total amount:</td>
                <td id="cart-total">$0.00</td>
                <td></td>
            </tr>
        </tfoot>
    </table>
    <p style="text-align: center;">
        <button class="btn-reset" id="clear-cart" type="button" data-cart-action="clear">Clear cart</button>
        <a class="btn-reset continue-shopping" href="catalogue.html">Continue shopping</a>
    </p>
    <script src="script.js"></script>
</body>
</html>
