<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>SIGN IN</h2>
            <p>Access your bookstore account</p>
        </div>
        
        <form name="f1" method="post" action="home.html">
            <table align="center">
                <tr>
                    <td>ID:</td>
                    <td><input type="text" name="t1" placeholder="Enter Username" required></td>
                </tr>
                <tr>
                    <td>Pass:</td>
                    <td><input type="password" name="t2" placeholder="Enter Password" required></td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <button type="submit" class="btn-submit">Login</button>
                        <button type="reset" class="btn-reset">Clear</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
