<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalogue Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="catalogue-body">

    <h2>General Book Catalogue</h2>
    
    <table class="catalogue-table">
        <tr>
            <th style="text-align: center;">Cover Page</th>
            <th>Book Details</th>
            <th>Price</th>
            <th style="text-align: center;">Action</th>
        </tr>
        <tr>
            <td style="text-align: center;">
                <img src="images/xml_bible.jpg" alt="XML Bible" class="book-img">
            </td>
            <td>
                <b>Book:</b> XML Bible<br><br>
                <b>Author:</b> Winston<br><br>
                <b>Publication:</b> Wiely
            </td>
            <td>$40.5</td>
            <td style="text-align: center;">
                <button class="add-cart-btn">Add to cart</button>
            </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                <img src="images/ai_book.jpg" alt="Artificial Intelligence" class="book-img">
            </td>
            <td>
                <b>Book:</b> AI<br><br>
                <b>Author:</b> S. Russel<br><br>
                <b>Publication:</b> Princetonhall
            </td>
            <td>$63</td>
            <td style="text-align: center;">
                <button class="add-cart-btn">Add to cart</button>
            </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                <img src="images/java_book.jpg" alt="Java 2" class="book-img">
            </td>
            <td>
                <b>Book:</b> Java 2<br><br>
                <b>Author:</b> Watson<br><br>
                <b>Publication:</b> BPBpublications
            </td>
            <td>$35.5</td>
            <td style="text-align: center;">
                <button class="add-cart-btn">Add to cart</button>
            </td>
        </tr>
    </table>

</body>
</html>
